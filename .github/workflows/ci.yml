name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (Format, Types, Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Run unit & integration tests (Vitest)
        run: npm test

      - name: Production build (esbuild)
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -s build/main.js || { echo "ERROR: build/main.js missing or empty"; exit 1; }
          test -s build/manifest.json || { echo "ERROR: build/manifest.json missing or empty"; exit 1; }
          test -s build/styles.css || { echo "ERROR: build/styles.css missing or empty"; exit 1; }
          echo "All build artifacts present and verified."
