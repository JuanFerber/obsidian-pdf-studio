name: Release Obsidian Plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate version alignment
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")

          echo "Tag: $TAG_VERSION | package.json: $PKG_VERSION | manifest.json: $MANIFEST_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: Version mismatch between Git tag ($TAG_VERSION), package.json ($PKG_VERSION), and manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Run quality gates
        run: |
          npm run format:check
          npx tsc --noEmit
          npm test

      - name: Build plugin
        run: npm run build

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/main.js
            build/manifest.json
            build/styles.css
